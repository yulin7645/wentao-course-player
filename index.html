<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://xiaoe-player-live-replay-bnhcnqojqg.cn-hangzhou.fcapp.run; media-src 'self' https: blob:; img-src data:; base-uri 'none'; form-action 'none'">
  <title>文韬课程云端播放器</title>
  <style>
    :root{--bg:#08100f;--fg:#eef8f2;--muted:#9aaca4;--accent:#b8f05c;--card:rgba(17,30,27,.92);--line:rgba(184,240,92,.18)}
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
    main{min-height:100vh;display:grid;place-items:center;padding:40px 20px;background:radial-gradient(circle at 15% 10%,rgba(184,240,92,.16),transparent 30%),radial-gradient(circle at 90% 85%,rgba(56,185,146,.14),transparent 35%),linear-gradient(145deg,#07100e,#0b1714 55%,#08100f)}
    article{width:min(1040px,100%);padding:28px;border:1px solid var(--line);border-radius:28px;background:var(--card);box-shadow:0 30px 90px rgba(0,0,0,.38)}
    header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px}.eyebrow{margin:0 0 8px;color:var(--accent);font:12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em}
    h1{margin:0;font-size:clamp(24px,4vw,40px);line-height:1.15;letter-spacing:-.035em}.badge{flex:none;padding:8px 12px;border:1px solid var(--line);border-radius:999px;color:var(--accent);font-size:13px}
    .frame{overflow:hidden;position:relative;display:grid;place-items:center;aspect-ratio:16/9;border:1px solid rgba(255,255,255,.08);border-radius:20px;background:#030706}video{display:none;width:100%;height:100%;background:#000}.status{display:grid;justify-items:center;gap:16px;padding:30px;color:var(--muted);text-align:center}.status p{margin:0}.pulse{width:42px;height:42px;border:2px solid rgba(184,240,92,.22);border-top-color:var(--accent);border-radius:50%;animation:spin .9s linear infinite}
    footer{display:grid;grid-template-columns:auto auto 1fr;align-items:center;gap:28px;padding-top:20px;color:var(--muted);font-size:13px}footer div{display:grid;gap:4px}footer strong{color:var(--fg);font:500 13px ui-monospace,SFMono-Regular,Menlo,monospace}footer p{justify-self:end;margin:0;text-align:right}small{font-size:11px;letter-spacing:.08em;text-transform:uppercase}
    @keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}@media(max-width:700px){main{align-items:start;padding:18px 12px}article{padding:16px;border-radius:20px}header{margin-bottom:16px}.badge{display:none}.frame{border-radius:14px}footer{grid-template-columns:1fr 1fr;gap:16px}footer p{grid-column:1/-1;justify-self:start;text-align:left}}
  </style>
</head>
<body>
  <main>
    <article>
      <header><div><p class="eyebrow">PRIVATE COURSE ARCHIVE</p><h1>文韬课程云端播放器</h1></div><span class="badge">私有 OSS</span></header>
      <div class="frame">
        <video id="video" controls playsinline preload="metadata" aria-label="课程视频播放器"></video>
        <div class="status" id="status"><span class="pulse" aria-hidden="true"></span><p id="message">正在准备私有播放地址…</p></div>
      </div>
      <footer>
        <div><small>资源</small><strong id="resource">等待链接</strong></div>
        <div><small>大小</small><strong id="size">—</strong></div>
        <p>播放地址为临时签名；课程文件保存在私有云空间。</p>
      </footer>
    </article>
  </main>
  <script>
    const signerBaseUrl="https://xiaoe-player-live-replay-bnhcnqojqg.cn-hangzhou.fcapp.run";
    const params=new URLSearchParams(location.hash.slice(1)||location.search);
    const rid=params.get("rid")||"",token=params.get("token")||"";
    const video=document.getElementById("video"),status=document.getElementById("status"),message=document.getElementById("message");
    const resource=document.getElementById("resource"),size=document.getElementById("size");
    const formatSize=bytes=>{const mb=Number(bytes||0)/1024/1024;return mb>=1024?(mb/1024).toFixed(2)+" GB":mb.toFixed(1)+" MB"};
    if(!/^v_[A-Za-z0-9]+$/.test(rid)||!/^[a-f0-9]{64}$/.test(token)){
      status.querySelector(".pulse").style.display="none";message.textContent="播放链接不完整，请从课程表重新打开。";
    }else{
      resource.textContent=rid.slice(0,8)+"…"+rid.slice(-6);
      const signUrl=new URL("/sign",signerBaseUrl);signUrl.searchParams.set("rid",rid);signUrl.searchParams.set("token",token);
      fetch(signUrl,{cache:"no-store",referrerPolicy:"no-referrer"}).then(async response=>{
        const body=await response.json();if(!response.ok||!body.ok||!body.url)throw new Error("signing_failed");
        size.textContent=formatSize(body.size_bytes);video.src=body.url;video.style.display="block";status.style.display="none";
      }).catch(()=>{status.querySelector(".pulse").style.display="none";message.textContent="暂时无法取得播放地址，请稍后从课程表重试。";});
    }
  </script>
</body>
</html>
